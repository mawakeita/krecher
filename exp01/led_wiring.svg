<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">LED test circuit: GPIO21 to LED to GND</text>

  <!-- Pi box -->
  <rect x="40" y="105" width="150" height="180" rx="8" fill="#f3f4f6" stroke="#444" stroke-width="2"/>
  <text x="115" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Raspberry Pi</text>
  <text x="115" y="168" text-anchor="middle" font-size="13" fill="#555">(header pins)</text>

  <!-- signal wire -->
  <path d="M190 150 H300" stroke="#d9480f" stroke-width="4" fill="none"/>
  <path d="M380 150 H470" stroke="#d9480f" stroke-width="4" fill="none"/>
  <text x="195" y="135" font-size="14" font-weight="bold" fill="#d9480f">GPIO21</text>
  <text x="195" y="172" font-size="12" fill="#555">(pin 40)</text>

  <!-- resistor -->
  <rect x="300" y="136" width="80" height="28" fill="#fff" stroke="#1c5fa8" stroke-width="3"/>
  <text x="340" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c5fa8">Resistor</text>
  <text x="340" y="184" text-anchor="middle" font-size="12" fill="#555">either way round</text>

  <!-- LED -->
  <polygon points="470,115 470,185 540,150" fill="#ffe14d" stroke="#222" stroke-width="3"/>
  <line x1="540" y1="115" x2="540" y2="185" stroke="#222" stroke-width="4"/>
  <text x="505" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">LED</text>
  <text x="470" y="215" text-anchor="middle" font-size="13" fill="#d9480f">long leg (+)</text>
  <text x="470" y="232" text-anchor="middle" font-size="12" fill="#555">anode, faces GPIO</text>
  <text x="640" y="100" text-anchor="middle" font-size="13" fill="#333">short leg (-)</text>
  <text x="640" y="117" text-anchor="middle" font-size="12" fill="#555">cathode, faces GND</text>

  <!-- ground return -->
  <path d="M540 150 H780 V255 H190" stroke="#333" stroke-width="4" fill="none"/>
  <text x="195" y="245" font-size="14" font-weight="bold" fill="#333">GND</text>
  <text x="195" y="278" font-size="12" fill="#555">(any GND pin, e.g. pin 34)</text>

  <!-- current arrow -->
  <path d="M230 322 H660" stroke="#999" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <polygon points="660,316 674,322 660,328" fill="#999"/>
  <text x="450" y="312" text-anchor="middle" font-size="13" fill="#555">GPIO21 set high (3.3V): current flows this way and the LED lights</text>

  <!-- photo key -->
  <rect x="40" y="345" width="820" height="56" rx="8" fill="#f8f5e6" stroke="#d8cfa5"/>
  <text x="56" y="368" font-size="13" fill="#333">On your breadboard: resistor from the GPIO21 row down to the LED long leg.</text>
  <text x="56" y="388" font-size="13" fill="#333">Black jumper: LED short leg to the power rail. Yellow jumper: same rail to the GND pin.</text>
</svg>
