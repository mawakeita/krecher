<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Micro-switch wiring: GPIO17 and GND</text>

  <!-- Pi box -->
  <rect x="40" y="80" width="160" height="240" rx="8" fill="#f3f4f6" stroke="#444" stroke-width="2"/>
  <text x="120" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Raspberry Pi 5</text>
  <text x="120" y="236" text-anchor="middle" font-size="12" fill="#555">(header pins)</text>

  <!-- internal pull-up -->
  <text x="150" y="102" text-anchor="middle" font-size="12" fill="#555">3.3V</text>
  <line x1="150" y1="108" x2="150" y2="118" stroke="#888" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="142" y="118" width="16" height="22" fill="#fff" stroke="#888" stroke-width="2"/>
  <line x1="150" y1="140" x2="150" y2="150" stroke="#888" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="150" y1="150" x2="200" y2="150" stroke="#d9480f" stroke-width="4"/>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#888">internal pull-up</text>
  <text x="120" y="186" text-anchor="middle" font-size="11" fill="#888">(enabled in code)</text>

  <!-- GPIO17 wire -->
  <path d="M200 150 H320 V180 H440" stroke="#d9480f" stroke-width="4" fill="none"/>
  <text x="208" y="140" font-size="14" font-weight="bold" fill="#d9480f">GPIO17</text>
  <text x="270" y="140" font-size="12" fill="#555">(pin 11)</text>

  <!-- GND wire -->
  <path d="M620 235 H700 V290 H200" stroke="#333" stroke-width="4" fill="none"/>
  <text x="208" y="280" font-size="14" font-weight="bold" fill="#333">GND</text>
  <text x="250" y="280" font-size="12" fill="#555">(pin 9)</text>

  <!-- switch body -->
  <rect x="420" y="95" width="230" height="170" rx="10" fill="#fafafa" stroke="#aaa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="535" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Micro-switch (SPDT)</text>

  <!-- terminals -->
  <circle cx="440" cy="180" r="7" fill="#d9480f"/>
  <circle cx="620" cy="125" r="7" fill="#bbb"/>
  <circle cx="620" cy="235" r="7" fill="#333"/>
  <text x="440" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#d9480f">COM</text>
  <text x="620" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">NC</text>
  <text x="620" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">NO</text>
  <text x="662" y="129" font-size="12" fill="#888">leave empty</text>

  <!-- lever: resting to NC (solid), pressed to NO (dashed) -->
  <line x1="440" y1="180" x2="612" y2="130" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="440" y1="180" x2="612" y2="230" stroke="#333" stroke-width="4" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="500" y="243" text-anchor="middle" font-size="12" fill="#333">pressed</text>

  <!-- state explainers -->
  <rect x="40" y="345" width="395" height="70" rx="8" fill="#f8f5e6" stroke="#d8cfa5"/>
  <text x="56" y="367" font-size="13" font-weight="bold" fill="#333">Lever up (released)</text>
  <text x="56" y="386" font-size="12" fill="#333">COM touches NC, which is unconnected. GPIO17 is pulled up</text>
  <text x="56" y="403" font-size="12" fill="#333">to 3.3V, so the Pi reads HIGH (1).</text>

  <rect x="465" y="345" width="395" height="70" rx="8" fill="#e7f3ea" stroke="#a9cfb2"/>
  <text x="481" y="367" font-size="13" font-weight="bold" fill="#333">Lever down (pressed)</text>
  <text x="481" y="386" font-size="12" fill="#333">COM touches NO, joining GPIO17 to GND. The Pi reads</text>
  <text x="481" y="403" font-size="12" fill="#333">LOW (0), which the script reports as a touch.</text>

  <text x="450" y="447" text-anchor="middle" font-size="12" fill="#555">Breadboard: COM row to a jumper to the GPIO17 row. NO row to a jumper to a GND row. NC row stays empty.</text>
  <text x="450" y="467" text-anchor="middle" font-size="12" fill="#555">No resistor is needed on the switch: the Pi's internal pull-up does that job.</text>
</svg>
