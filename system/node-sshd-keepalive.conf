# Copy of /etc/ssh/sshd_config.d/krecher-keepalive.conf on the Oracle node (sldllm-node).
# Drops dead SSH sessions (e.g. the Pi's tunnel after a Wi-Fi switch or drop)
# within ~90 s, so port 2222 is freed and the Pi's autossh can reconnect.
# Install on the node:
#   sudo cp node-sshd-keepalive.conf /etc/ssh/sshd_config.d/krecher-keepalive.conf
#   sudo sshd -t && sudo systemctl reload ssh
ClientAliveInterval 30
ClientAliveCountMax 3
