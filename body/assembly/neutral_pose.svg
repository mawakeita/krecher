<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">krēCHer leg: neutral pose (all 3 servos on Neutral)</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#555">Target angles for fitting the horns. Each joint sits in the middle of its range, so it can move both ways.</text>

  <text x="230" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">A · Top view: hip (coxa)</text>
  <g transform="translate(230,370)">
    <g stroke="#9ca3af" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-190"/>
      <line x1="0" y1="0" x2="0" y2="190"/>
      <line x1="0" y1="0" x2="164" y2="-95"/>
      <line x1="0" y1="0" x2="-164" y2="-95"/>
      <line x1="0" y1="0" x2="164" y2="95"/>
      <line x1="0" y1="0" x2="-164" y2="95"/>
    </g>
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#374151">body plate</text>
    <g fill="#1f2937">
      <circle cx="0" cy="-110" r="9"/><circle cx="0" cy="110" r="9"/>
      <circle cx="95" cy="-55" r="9"/><circle cx="-95" cy="-55" r="9"/>
      <circle cx="95" cy="55" r="9"/><circle cx="-95" cy="55" r="9"/>
    </g>
    <path d="M 125,-130 A 145 145 0 0 1 160,-30" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 160,-30 A 145 145 0 0 0 125,-130" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arr)"/>
    <text x="100" y="-170" font-size="13" fill="#c2410c">swings</text>
    <text x="100" y="-154" font-size="13" fill="#c2410c">both ways</text>
  </g>
  <text x="230" y="600" text-anchor="middle" font-size="14" fill="#111">Each leg points <tspan font-weight="bold">straight out</tspan> from its lobe,</text>
  <text x="230" y="620" text-anchor="middle" font-size="14" fill="#111">in line with the arm of the plate.</text>

  <line x1="455" y1="100" x2="455" y2="640" stroke="#e5e7eb" stroke-width="2"/>

  <text x="725" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">B · Side view: femur + knee</text>
  <line x1="480" y1="560" x2="980" y2="560" stroke="#6b7280" stroke-width="2"/>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="500" y1="560" x2="488" y2="572"/><line x1="560" y1="560" x2="548" y2="572"/>
    <line x1="620" y1="560" x2="608" y2="572"/><line x1="680" y1="560" x2="668" y2="572"/>
    <line x1="740" y1="560" x2="728" y2="572"/><line x1="800" y1="560" x2="788" y2="572"/>
    <line x1="860" y1="560" x2="848" y2="572"/><line x1="920" y1="560" x2="908" y2="572"/>
    <line x1="960" y1="560" x2="948" y2="572"/>
  </g>
  <text x="975" y="590" text-anchor="end" font-size="12" fill="#6b7280">ground</text>

  <rect x="480" y="262" width="120" height="8" fill="#9ca3af" stroke="#374151"/>
  <rect x="480" y="340" width="120" height="8" fill="#9ca3af" stroke="#374151"/>
  <text x="530" y="250" text-anchor="middle" font-size="12" fill="#374151">body (upper + lower plate)</text>

  <rect x="600" y="262" width="58" height="86" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <rect x="612" y="278" width="40" height="56" fill="#1f2937"/>
  <circle cx="645" cy="305" r="7" fill="#9ca3af" stroke="#fff" stroke-width="1.5"/>
  <text x="629" y="380" text-anchor="middle" font-size="12" fill="#374151">hip bracket</text>
  <text x="629" y="395" text-anchor="middle" font-size="12" fill="#374151">(femur servo)</text>

  <line x1="645" y1="305" x2="820" y2="305" stroke="#9ca3af" stroke-width="22" stroke-linecap="round"/>
  <line x1="645" y1="305" x2="820" y2="305" stroke="#4b5563" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="732" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">upper-leg link: LEVEL</text>

  <rect x="800" y="285" width="42" height="56" fill="#1f2937"/>
  <circle cx="820" cy="305" r="7" fill="#9ca3af" stroke="#fff" stroke-width="1.5"/>

  <path d="M 812 270 Q 900 360 858 556" fill="none" stroke="#9ca3af" stroke-width="16" stroke-linecap="round"/>
  <circle cx="858" cy="556" r="5" fill="#111"/>
  <text x="870" y="545" font-size="12" fill="#111">foot</text>

  <line x1="820" y1="305" x2="858" y2="556" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M 780,305 A 40 40 0 0 0 826,345" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="752" y="372" font-size="15" font-weight="bold" fill="#c2410c">≈ 90°</text>
  <text x="900" y="430" font-size="13" font-weight="bold" fill="#111">calf hangs</text>
  <text x="900" y="446" font-size="13" font-weight="bold" fill="#111">DOWN</text>

  <rect x="40" y="640" width="920" height="50" rx="6" fill="#f3f4f6"/>
  <text x="500" y="661" text-anchor="middle" font-size="13" fill="#111"><tspan font-weight="bold">Hip:</tspan> leg straight out · <tspan font-weight="bold">Femur:</tspan> link level · <tspan font-weight="bold">Knee:</tspan> calf ≈ 90° to the link (knee-to-foot line, not the curve). Mirror for the other side.</text>
  <text x="500" y="680" text-anchor="middle" font-size="12" fill="#555">Get within one spline tooth (≈14°) by re-seating the horn; the last few degrees are trimmed in software.</text>
</svg>
