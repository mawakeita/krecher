<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#1f2430">Servo test bench: wiring</text>
  <text x="40" y="76" font-size="15" fill="#555c6b">3S LiPo → buck converter (≈5.8 V) → HJ servo tester → one MG996R at a time. The battery goes in last and comes out first.</text>

  <!-- ===== Battery ===== -->
  <rect x="40" y="130" width="190" height="110" rx="10" fill="#2d2d2d"/>
  <text x="135" y="172" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3S LiPo</text>
  <text x="135" y="194" font-size="13" fill="#cfcfcf" text-anchor="middle">2200 mAh · 11.1 V nominal</text>
  <text x="135" y="214" font-size="13" fill="#cfcfcf" text-anchor="middle">(balance lead unused)</text>
  <!-- XT60 -->
  <rect x="250" y="168" width="54" height="34" rx="5" fill="#f2b705" stroke="#8a6a00"/>
  <text x="277" y="190" font-size="12" font-weight="bold" fill="#3d2f00" text-anchor="middle">XT60</text>
  <path d="M230 178 H250" stroke="#d62828" stroke-width="6"/>
  <path d="M230 194 H250" stroke="#1a1a1a" stroke-width="6"/>
  <text x="277" y="228" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">plug in LAST</text>
  <text x="277" y="244" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">unplug FIRST</text>

  <!-- pigtail to buck -->
  <path d="M304 178 H380 V170 H420" stroke="#d62828" stroke-width="6" fill="none"/>
  <path d="M304 194 H380 V214 H420" stroke="#1a1a1a" stroke-width="6" fill="none"/>
  <text x="340" y="160" font-size="12" fill="#555c6b">pigtail</text>

  <!-- ===== Buck converter ===== -->
  <rect x="420" y="120" width="250" height="150" rx="8" fill="#e9edf2" stroke="#7a8494" stroke-width="2"/>
  <text x="545" y="148" font-size="17" font-weight="bold" fill="#1f2430" text-anchor="middle">Buck converter (CC/CV)</text>
    <circle cx="440" cy="170" r="9" fill="#cfd4dc" stroke="#555"/><text x="456" y="175" font-size="13" font-weight="bold" fill="#d62828">+IN</text>
  <circle cx="440" cy="214" r="9" fill="#cfd4dc" stroke="#555"/><text x="456" y="219" font-size="13" font-weight="bold" fill="#1a1a1a">−IN</text>
  <rect x="510" y="186" width="16" height="16" fill="#2457c9"/><rect x="532" y="186" width="16" height="16" fill="#2457c9"/>
  <text x="529" y="222" font-size="11" fill="#2457c9" text-anchor="middle">CV / CC screws</text><text x="529" y="240" font-size="11" fill="#2457c9" text-anchor="middle">CV ≈ 5.80 V</text>
  <circle cx="650" cy="196" r="9" fill="#cfd4dc" stroke="#555"/><text x="634" y="201" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">OUT−</text>
  <circle cx="650" cy="244" r="9" fill="#cfd4dc" stroke="#555"/><text x="634" y="249" font-size="13" font-weight="bold" fill="#d62828" text-anchor="end">OUT+</text>
  <text x="420" y="290" font-size="12" fill="#555c6b">OUT− = terminal next to the blue screws</text>
  <text x="420" y="306" font-size="12" fill="#555c6b">Red LED on = powered</text>

  <!-- buck to tester IN -->
  <path d="M659 196 H760 V478 H861" stroke="#1a1a1a" stroke-width="4" fill="none"/>
  <path d="M659 244 H740 V453 H861" stroke="#d62828" stroke-width="4" fill="none"/>

  <!-- ===== Multimeter ===== -->
  <rect x="420" y="360" width="250" height="120" rx="10" fill="#fff7c2" stroke="#8a7a10" stroke-width="2"/>
  <text x="545" y="388" font-size="15" font-weight="bold" fill="#1f2430" text-anchor="middle">Check: AstroAI AM33D</text>
  <text x="545" y="410" font-size="13" fill="#1f2430" text-anchor="middle">dial V⎓ 20 · black COM · red VΩmA</text>
  <text x="545" y="432" font-size="13" fill="#1f2430" text-anchor="middle">red probe OUT+, black probe OUT−</text>
  <text x="545" y="454" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">expect ≈ 5.80 V</text>
  <text x="545" y="472" font-size="11" fill="#555c6b" text-anchor="middle">a minus sign means the probes are reversed</text>
  <path d="M600 360 L648 254" stroke="#d62828" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M630 360 L652 206" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- ===== Tester header detail ===== -->
  <text x="840" y="378" font-size="15" font-weight="bold" fill="#1f2430">HJ tester pin header (tester face up)</text>
  <text x="868" y="408" font-size="12" font-weight="bold" fill="#1f2430" text-anchor="middle">IN</text>
  <text x="948" y="408" font-size="12" font-weight="bold" fill="#1f2430" text-anchor="middle">1</text>
  <text x="988" y="408" font-size="12" font-weight="bold" fill="#1f2430" text-anchor="middle">2</text>
  <text x="1028" y="408" font-size="12" font-weight="bold" fill="#1f2430" text-anchor="middle">3</text>
  <text x="1068" y="408" font-size="12" font-weight="bold" fill="#1f2430" text-anchor="middle">4</text>
  <text x="1008" y="394" font-size="10" fill="#555c6b" text-anchor="middle">OUT</text>
  <rect x="840" y="414" width="250" height="84" rx="4" fill="#1a1a1a"/>
  <g fill="#cfd4dc">
    <rect x="862" y="422" width="12" height="12"/><rect x="862" y="447" width="12" height="12"/><rect x="862" y="472" width="12" height="12"/>
    <rect x="982" y="422" width="12" height="12"/><rect x="982" y="447" width="12" height="12"/><rect x="982" y="472" width="12" height="12"/>
    <rect x="1022" y="422" width="12" height="12"/><rect x="1022" y="447" width="12" height="12"/><rect x="1022" y="472" width="12" height="12"/>
    <rect x="1062" y="422" width="12" height="12"/><rect x="1062" y="447" width="12" height="12"/><rect x="1062" y="472" width="12" height="12"/>
  </g>
  <!-- IN wires land -->
  <circle cx="868" cy="453" r="7" fill="#d62828"/>
  <circle cx="868" cy="478" r="7" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
    <text x="868" y="514" font-size="10" fill="#555c6b" text-anchor="middle">S unused</text>
  <!-- servo plug on OUT 1 -->
  <rect x="936" y="414" width="24" height="84" rx="3" fill="#3a3a3a" stroke="#000"/>
  <rect x="942" y="422" width="12" height="12" fill="#f28c00"/>
  <rect x="942" y="447" width="12" height="12" fill="#d62828"/>
  <rect x="942" y="472" width="12" height="12" fill="#6b3e1e"/>
  <text x="1100" y="433" font-size="12" font-weight="bold" fill="#1f2430">S · top</text>
  <text x="1100" y="458" font-size="12" font-weight="bold" fill="#d62828">+ · middle</text>
  <text x="1100" y="483" font-size="12" font-weight="bold" fill="#1a1a1a">− · bottom</text>
  <text x="972" y="518" font-size="12" fill="#555c6b">buck OUT+ → IN middle (+)</text>
  <text x="972" y="534" font-size="12" fill="#555c6b">buck OUT− → IN bottom (−)</text>

  <!-- servo -->
  <path d="M942 498 V600" stroke="#f28c00" stroke-width="4"/>
  <path d="M948 498 V600" stroke="#d62828" stroke-width="4"/>
  <path d="M954 498 V600" stroke="#6b3e1e" stroke-width="4"/>
  <rect x="880" y="600" width="170" height="70" rx="8" fill="#2d2d2d" stroke="#000"/>
  <circle cx="1025" cy="635" r="14" fill="#f2f2f2"/>
  <text x="940" y="630" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">MG996R</text>
  <text x="940" y="652" font-size="12" fill="#cfcfcf" text-anchor="middle">one at a time</text>
  <text x="866" y="612" font-size="12" font-weight="bold" fill="#b86b00" text-anchor="end">orange/yellow = signal (top)</text>
  <text x="866" y="630" font-size="12" font-weight="bold" fill="#d62828" text-anchor="end">red = + (middle)</text>
  <text x="866" y="648" font-size="12" font-weight="bold" fill="#6b3e1e" text-anchor="end">brown = − (bottom)</text>

  <!-- ===== Tester face ===== -->
  <rect x="40" y="380" width="330" height="170" rx="14" fill="#2447c9" stroke="#14286e" stroke-width="2"/>
  <text x="205" y="406" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">HJ servo tester (4.8–6 V)</text>
  <rect x="40" y="420" width="14" height="90" fill="#1a1a1a"/>
  <text x="66" y="470" font-size="10" fill="#ffffff" transform="rotate(-90 66 470)">pins</text>
  <rect x="120" y="420" width="150" height="54" rx="4" fill="#111111"/>
  <text x="195" y="459" font-size="30" fill="#ff5a3c" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">1500</text>
  <circle cx="320" cy="447" r="20" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="485" font-size="11" fill="#ffffff" text-anchor="middle">knob</text>
  <ellipse cx="150" cy="500" rx="13" ry="8" fill="#1a1a1a"/>
  <ellipse cx="230" cy="500" rx="13" ry="8" fill="#1a1a1a"/>
  <text x="150" y="530" font-size="12" fill="#ffffff" text-anchor="middle">Select</text>
  <text x="230" y="530" font-size="12" fill="#ffffff" text-anchor="middle">Pulse Width</text>
  <text x="40" y="576" font-size="13" fill="#1f2430"><tspan font-weight="bold">Select</tspan> switches mode: Manual (knob) · Neutral (1500 µs, centre) · Auto (sweep).</text>
  <text x="40" y="596" font-size="13" fill="#1f2430">The number is the pulse width in microseconds. 1500 = servo centre.</text>
  <text x="40" y="616" font-size="13" fill="#1f2430">Dark display = no power.</text>

  <!-- safety strip -->
  <rect x="40" y="680" width="800" height="54" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="60" y="704" font-size="13" font-weight="bold" fill="#8b1c13">Never connect the 3S LiPo to the Fusion HAT+. Work on the LiPo bag.</text>
  <text x="60" y="724" font-size="13" fill="#5a1410">Dark display, loud buzzing, heat or a smell → unplug the battery first, then look.</text>
</svg>
