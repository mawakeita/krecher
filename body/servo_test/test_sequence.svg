<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="bold" fill="#1f2430">One servo, start to finish (≈ 3 min each)</text>
  <text x="40" y="72" font-size="14" fill="#555c6b">The display shows the pulse width in µs. Leave every servo at Neutral when you unplug it, so it's centred and ready for its horn.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a8494"/></marker>
  </defs>

  <!-- step boxes: x = 40 + i*190, width 170 -->
  <g font-size="13" fill="#1f2430">
    <!-- 1 -->
    <rect x="40" y="100" width="170" height="250" rx="10" fill="#f3f5f8" stroke="#cfd4de"/>
    <text x="56" y="126" font-size="15" font-weight="bold">1 · Wire it</text>
    <rect x="65" y="140" width="120" height="44" rx="4" fill="#111"/>
    <text x="125" y="172" font-size="21" fill="#3a3a3a" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">8.8.8.8</text>
    <text x="56" y="210">Battery OUT.</text>
    <text x="56" y="230">Servo into OUT 1:</text>
    <text x="56" y="250">signal top,</text>
    <text x="56" y="270">brown bottom.</text>
    <text x="56" y="300" fill="#555c6b" font-size="12">Display dark</text>

    <!-- 2 -->
    <rect x="230" y="100" width="170" height="250" rx="10" fill="#f3f5f8" stroke="#cfd4de"/>
    <text x="246" y="126" font-size="15" font-weight="bold">2 · Power on</text>
    <rect x="255" y="140" width="120" height="44" rx="4" fill="#111"/>
    <text x="315" y="172" font-size="26" fill="#ff5a3c" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">1500</text>
    <text x="246" y="210">Battery IN, last.</text>
    <text x="246" y="230">Buck LED lights,</text>
    <text x="246" y="250">display ≈ 1500.</text>
    <text x="246" y="300" fill="#555c6b" font-size="12">Servo may twitch</text>
    <text x="246" y="316" fill="#555c6b" font-size="12">once to centre</text>

    <!-- 3 -->
    <rect x="420" y="100" width="170" height="250" rx="10" fill="#f3f5f8" stroke="#cfd4de"/>
    <text x="436" y="126" font-size="15" font-weight="bold">3 · Neutral</text>
    <rect x="445" y="140" width="120" height="44" rx="4" fill="#111"/>
    <text x="505" y="172" font-size="26" fill="#ff5a3c" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">1500</text>
    <text x="436" y="210">Select → Neutral.</text>
    <text x="436" y="230">Moves to centre</text>
    <text x="436" y="250">and holds.</text>
    <text x="436" y="300" fill="#2e7d32" font-size="12" font-weight="bold">pass: holds still,</text>
    <text x="436" y="316" fill="#2e7d32" font-size="12" font-weight="bold">quiet</text>

    <!-- 4 -->
    <rect x="610" y="100" width="170" height="250" rx="10" fill="#f3f5f8" stroke="#cfd4de"/>
    <text x="626" y="126" font-size="15" font-weight="bold">4 · Manual</text>
    <rect x="635" y="140" width="120" height="44" rx="4" fill="#111"/>
    <text x="695" y="172" font-size="26" fill="#ff5a3c" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">1534</text>
    <text x="626" y="210">Select → Manual.</text>
    <text x="626" y="230">Turn the knob</text>
    <text x="626" y="250">slowly end to end.</text>
    <text x="626" y="300" fill="#2e7d32" font-size="12" font-weight="bold">pass: smooth, no</text>
    <text x="626" y="316" fill="#2e7d32" font-size="12" font-weight="bold">jumps or grinding</text>

    <!-- 5 -->
    <rect x="800" y="100" width="170" height="250" rx="10" fill="#f3f5f8" stroke="#cfd4de"/>
    <text x="816" y="126" font-size="15" font-weight="bold">5 · Auto, 1 min</text>
    <rect x="825" y="140" width="120" height="44" rx="4" fill="#111"/>
    <text x="885" y="172" font-size="22" fill="#ff5a3c" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">sweep</text>
    <text x="816" y="210">Select → Auto.</text>
    <text x="816" y="230">Let it sweep for</text>
    <text x="816" y="250">a full minute.</text>
    <text x="816" y="300" fill="#2e7d32" font-size="12" font-weight="bold">pass: steady, not</text>
    <text x="816" y="316" fill="#2e7d32" font-size="12" font-weight="bold">hot to the touch</text>

    <!-- 6 -->
    <rect x="990" y="100" width="170" height="250" rx="10" fill="#eaf5ec" stroke="#2e7d32" stroke-width="2"/>
    <text x="1006" y="126" font-size="15" font-weight="bold">6 · Neutral, off</text>
    <rect x="1015" y="140" width="120" height="44" rx="4" fill="#111"/>
    <text x="1075" y="172" font-size="26" fill="#ff5a3c" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">1500</text>
    <text x="1006" y="210">Back to Neutral.</text>
    <text x="1006" y="230">Battery OUT,</text>
    <text x="1006" y="250">then the servo.</text>
    <text x="1006" y="300" fill="#2e7d32" font-size="12" font-weight="bold">Centred. Don't turn</text>
    <text x="1006" y="316" fill="#2e7d32" font-size="12" font-weight="bold">the shaft by hand.</text>
  </g>

  <g stroke="#7a8494" stroke-width="2" marker-end="url(#a)">
    <path d="M211 225 H228"/><path d="M401 225 H418"/><path d="M591 225 H608"/><path d="M781 225 H798"/><path d="M971 225 H988"/>
  </g>

  <rect x="40" y="370" width="1120" height="42" rx="8" fill="#fde8e8" stroke="#c0392b"/>
  <text x="60" y="397" font-size="13" fill="#5a1410"><tspan font-weight="bold">Fail</tspan> = doesn't move · jitters · grinds · sticks · gets hot · buzzes loudly at rest · doesn't return to centre. Label it, set it aside, keep going.</text>
</svg>
